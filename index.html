<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dish Duty</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup-screen" class="screen active">
  <div class="setup-wrap">
    <div class="setup-top">
      <div class="app-wordmark">dish<span>duty</span></div>
      <p class="setup-tagline">Track who washes the dishes.<br/>No arguments, no excuses.</p>
    </div>
    <div class="setup-card">
      <div class="field-label">Pick an avatar (optional)</div>
      <div class="avatar-pick-row" id="setup-avatar-row"></div>
      <div class="field-label" style="margin-top:16px">Your name</div>
      <input id="setup-name" type="text" placeholder="e.g. Armel" maxlength="25" autocomplete="off"/>
      <button class="btn-join" onclick="joinApp()">Join</button>
    </div>
    <div class="already-joined" id="already-joined" style="display:none">
      <p class="already-label">Already in the rotation</p>
      <div id="already-list"></div>
    </div>
  </div>
</div>

<!-- MAIN SCREEN -->
<div id="main-screen" class="screen">
  <div class="top-bar">
    <div class="app-wordmark sm">dish<span>duty</span></div>
    <div class="top-bar-right">
      <div class="sync-pill" id="sync-pill">
        <span class="sync-dot" id="sync-dot"></span>
        <span id="sync-label">live</span>
      </div>
      <button class="my-profile-btn" id="my-profile-btn" onclick="showProfileModal()"></button>
    </div>
  </div>

  <div class="page-scroll">

    <!-- TODAY HERO -->
    <div class="today-hero">
      <div class="today-meta">
        <span id="today-dayname" class="today-dayname"></span>
        <span id="today-fulldate" class="today-fulldate"></span>
      </div>
      <div class="today-label">On duty today</div>
      <div class="today-person-row">
        <div class="today-avatar-wrap" id="today-avatar-wrap"></div>
        <div class="today-name" id="today-name">—</div>
      </div>
      <div id="today-action"></div>
    </div>

    <!-- STATS -->
    <div class="stats-row" id="stats-row"></div>

    <!-- SCHEDULE -->
    <div class="section-block">
      <div class="section-head">
        <span class="section-title">Schedule</span>
        <span class="section-hint">missed days carry over</span>
      </div>
      <div class="card-list" id="schedule-list"></div>
    </div>

    <!-- MEMBERS -->
    <div class="section-block">
      <div class="section-head">
        <span class="section-title">Members</span>
      </div>
      <div class="card-list" id="member-list"></div>
    </div>

    <!-- HISTORY -->
    <div class="section-block">
      <div class="section-head">
        <span class="section-title">History</span>
      </div>
      <div class="card-list" id="history-list"></div>
    </div>

  </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal-overlay" id="profile-modal" style="display:none" onclick="closeProfileModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-avatar-big" id="modal-avatar-big"></div>
    <div class="modal-uname" id="modal-name-display"></div>
    <div class="modal-sec-label">Avatar</div>
    <div class="emoji-grid" id="emoji-grid"></div>
    <div class="modal-sec-label" style="margin-top:20px">Change name</div>
    <div class="modal-name-row">
      <input id="modal-name-input" type="text" maxlength="25" placeholder="Your name"/>
      <button onclick="saveName()">Save</button>
    </div>
    <button class="btn-leave" onclick="leaveDuty()">Leave rotation</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
